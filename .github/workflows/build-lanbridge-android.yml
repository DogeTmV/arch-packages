name: Build LanBridge Android APK

on:
  push:
    branches: [main]
    paths:
      - 'projects/lanbridge/android/**'
      - '.github/workflows/build-lanbridge-android.yml'
  pull_request:
    paths:
      - 'projects/lanbridge/android/**'
      - '.github/workflows/build-lanbridge-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/lanbridge/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanbridge-debug-apk
          path: projects/lanbridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
